[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.ruff.lint.per-file-ignores]
# Prompts do Gemini são texto corrido; quebrar as linhas mudaria o que é enviado ao modelo.
"agent_noticias/script_agent.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
