services:
  agente:
    build: .
    container_name: sintonia-agente
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
      HORARIO_EXECUCAO: ${HORARIO_EXECUCAO:-07:00}
      RODAR_AO_INICIAR: ${RODAR_AO_INICIAR:-false}
    volumes:
      - ./dados:/app/dados
      - ./frontend:/app/frontend
    restart: unless-stopped

  landing-page:
    image: nginx:1.27-alpine
    container_name: sintonia-landing-page
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    restart: unless-stopped
